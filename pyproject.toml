[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blade"
version = "0.3.0"
description = "BLADE — high-throughput materials discovery and thermodynamic database generation"
requires-python = ">=3.10"
dependencies = [
    "psutil>=7.2.2,<8",
    "pandarallel>=1.6.5,<2",
    "orb-models>=0.4.2,<0.5",
    "torch>=2.10.0,<3",
    "pymatgen>=2026.5.4,<2027",
    "sqsgenerator>=0.4.9,<0.5",
    "openpyxl>=3.1.5,<4",
    "pandas",
    "numpy",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13,<0.16",
    "black>=26.3.1,<27",
    "isort>=8.0.1,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["blade*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
