[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blade"
version = "1.7.0"
description = "General high-throughput materials discovery, thermodynamic modeling, and environmental stability analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psutil>=7.2.2,<8",
    "pandarallel>=1.6.5,<2",
    "torch>=2.10.0,<3",
    "pymatgen>=2026.5.4,<2027",
    "sqsgenerator>=0.4.9,<0.5",
    "openpyxl>=3.1.5,<4",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "pillow",
    "imageio",
    "ase",
]

[project.optional-dependencies]
workflow = [
    "materialsframework",
    "pycalphad>=0.11.1,<0.12",
    "mp-api>=0.46.4,<0.47",
    "orb-models>=0.4.2,<0.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13,<0.16",
    "black>=26.3.1,<27",
    "isort>=8.0.1,<9",
]

[tool.uv.sources]
materialsframework = { git = "https://github.com/ichasekatz/MaterialsFramework.git" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["blade*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
