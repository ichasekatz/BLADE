<!DOCTYPE html>
<title>BLADE Monitor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.3/3Dmol-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  :root {
    --bg:         #0D1117;
    --surface:    #161C27;
    --surface2:   #1B2333;
    --border:     #1E2A3E;
    --border2:    #253045;
    --accent:     #E8A030;
    --accent-dim: #A06B18;
    --teal:       #38B2A0;
    --teal-dim:   #1E6B62;
    --green:      #4CAF7D;
    --red:        #E05252;
    --text:       #CDD6E8;
    --text-muted: #5A6880;
    --text-dim:   #3A4860;
    --mono: "JetBrains Mono", monospace;
    --sans: "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* ── Header ─────────────────────────────────────────────── */
  #header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 48px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  #header .wordmark {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  #stage-bar {
    display: flex;
    gap: 6px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .stage-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    background: var(--surface);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .stage-pill .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .stage-pill.running { border-color: var(--accent); color: var(--accent); }
  .stage-pill.running .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .stage-pill.done { border-color: var(--green); color: var(--green); }
  .stage-pill.done .dot { background: var(--green); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #refresh-badge {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    margin-left: auto;
    flex-shrink: 0;
  }

  /* ── Main grid ───────────────────────────────────────────── */
  :root { --col-left:240px; --col-right:320px; --row-bottom:150px; }
  #main {
    display: grid;
    grid-template-columns: var(--col-left) 1fr var(--col-right);
    grid-template-rows: 1fr;
    height: calc(100vh - 48px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--row-bottom));
    min-height: 400px;
    transition: grid-template-columns 0.2s, height 0.2s;
  }
  #panel-bottom { transition: height 0.2s; }

  /* ── Left: pipeline log ──────────────────────────────────── */
  #panel-left {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  #systems-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }

  .system-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.15s;
  }

  .system-row:hover { background: var(--surface); }
  .system-row.active { border-left-color: var(--accent); background: var(--surface); }

  .system-name {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }

  .system-badge {
    font-family: var(--mono);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    letter-spacing: 0.04em;
  }
  .system-badge.done { background: rgba(76,175,125,0.15); color: var(--green); }
  .system-badge.running { background: rgba(232,160,48,0.15); color: var(--accent); }
  .system-badge.queued { background: var(--surface2); color: var(--text-muted); }

  .system-energy {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  #log-panel {
    border-top: 1px solid var(--border);
    height: 140px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 6px 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
    background: var(--bg);
  }

  .log-line {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
  }

  .log-line.accent { color: var(--accent); }
  .log-line.green  { color: var(--green); }
  .log-line.red    { color: var(--red); }

  /* ── Center: active system ───────────────────────────────── */
  #panel-center {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }

  #active-header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  #active-name {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  #active-substage {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  #viewer-traj {
    flex: 1;
    position: relative;
    background: #080D14;
    min-height: 0;
  }

  #traj-overlay {
    position: absolute;
    bottom: 8px; left: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
    z-index: 10;
    pointer-events: none;
  }

  .overlay-chip {
    background: rgba(13,17,23,0.82);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 2px 8px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  #energy-chart-wrap {
    height: 110px;
    padding: 6px 12px 6px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }

  #energy-label {
    position: absolute;
    top: 6px; left: 12px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  #energy-chart { width: 100% !important; height: 94px !important; }

  /* ── Right: SQS tiles ────────────────────────────────────── */
  #panel-right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sqs-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .sqs-tile:hover { border-color: var(--border2); }
  .sqs-tile.best  { border-color: var(--teal); }
  .sqs-tile.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .sqs-tile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 7px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .sqs-tile-id {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .sqs-obj {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--teal);
    font-variant-numeric: tabular-nums;
  }

  .sqs-viewer-wrap {
    height: 120px;
    position: relative;
    background: #060B10;
  }

  .sqs-viewer { width: 100%; height: 100%; }

  .sqs-no-data {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 90px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }

  /* ── Bottom: completed systems ───────────────────────────── */
  #panel-bottom {
    height: 150px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  #plots-strip {
    flex: 1;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 8px 12px;
    align-items: center;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }

  .plot-thumb {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
    width: 110px;
  }

  .plot-thumb:hover { border-color: var(--accent-dim); }

  .plot-thumb img {
    display: block;
    width: 100%;
    height: 86px;
    object-fit: cover;
  }

  .plot-thumb-label {
    padding: 3px 6px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-top: 1px solid var(--border);
  }

  .no-plots {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin: auto;
  }

  /* ── Modal for full image ────────────────────────────────── */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #modal.open { display: flex; }

  #modal img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 4px;
    border: 1px solid var(--border2);
  }

  /* ── Scrollbar global ────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── Responsive ──────────────────────────────────────────── */
  @media (max-width: 800px) {
    #main { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; }
    #panel-left { height: 240px; border-right: none; border-bottom: 1px solid var(--border); }
    #panel-right { height: 280px; border-top: 1px solid var(--border); }
    #panel-center { min-height: 340px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage-pill.running .dot { animation: none; }
  }

  /* ── Right panel tabs ────────────────────────────────────── */
  .stage-tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 0 14px;
    height: 36px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .stage-tab:hover { color: var(--text); }
  .stage-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content { display: flex; flex-direction: column; overflow-y: auto; flex: 1; min-height: 0; }

  #tdb-list { display: flex; flex-direction: column; gap: 1px; padding: 6px; }
  .tdb-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 4px;
    background: var(--surface); font-family: var(--mono); font-size: 10px;
    cursor: pointer; transition: background 0.12s;
  }
  .tdb-row:hover { background: var(--surface2); }
  .tdb-row .tdb-name { flex: 1; color: var(--text); }
  .tdb-badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; }
  .tdb-badge.done    { background: #1A3A2A; color: var(--green); }
  .tdb-badge.running { background: #2A1F0A; color: var(--accent); }
  .tdb-badge.queued  { background: var(--surface2); color: var(--text-dim); }

  #plots-strip-right {
    display: flex; flex-direction: column; gap: 6px; padding: 8px; overflow-y: auto;
  }
  .plot-thumb-right {
    cursor: pointer; border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border); transition: border-color 0.15s;
  }
  .plot-thumb-right:hover { border-color: var(--accent-dim); }
  .plot-thumb-right img { width: 100%; display: block; }
  .plot-thumb-right .plot-name {
    font-family: var(--mono); font-size: 9px; color: var(--text-dim); padding: 3px 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>

<!-- Header -->
<div id="header">
  <div class="wordmark">BLADE</div>
  <div id="stage-bar">
    <div class="stage-pill" data-stage="sqs_generation"><span class="dot"></span>SQS</div>
    <div class="stage-pill" data-stage="tdb_fitting"><span class="dot"></span>TDB</div>
    <div class="stage-pill" data-stage="phase_diagrams"><span class="dot"></span>Phase Diagrams</div>
    <div class="stage-pill" data-stage="oxide_database"><span class="dot"></span>Oxide DB</div>
    <div class="stage-pill" data-stage="oxidation_graphs"><span class="dot"></span>Oxidation</div>
  </div>
  <div id="refresh-badge">— —</div>
</div>

<!-- Main 3-column grid -->
<button id="edge-left" hidden onclick="collapsePanel('left')" title="Expand" style="position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:200;background:var(--surface2);border:1px solid var(--border);border-left:none;border-radius:0 5px 5px 0;color:var(--text-dim);cursor:pointer;padding:10px 5px;font-size:11px;line-height:1">▶</button>
<button id="edge-right" hidden onclick="collapsePanel('right')" title="Expand" style="position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:200;background:var(--surface2);border:1px solid var(--border);border-right:none;border-radius:5px 0 0 5px;color:var(--text-dim);cursor:pointer;padding:10px 5px;font-size:11px;line-height:1">◀</button>

<div id="main">

  <!-- Left: system list + log -->
  <div id="panel-left">
    <div class="panel-header">
      <span>Systems</span>
      <span id="sys-count">—</span>
      <button onclick="collapsePanel('left')" title="Collapse" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;padding:0 0 0 8px;line-height:1" id="btn-collapse-left">◀</button>
    </div>
    <div id="systems-list"></div>
    <div class="panel-header" style="border-top:1px solid var(--border); border-bottom:none; cursor:pointer" onclick="toggleLog()">
      <span>nohup.out</span>
      <span id="log-toggle" style="color:var(--text-dim)">▾</span>
    </div>
    <div id="log-panel"></div>
  </div>

  <!-- Center: active system -->
  <div id="panel-center">
    <div id="active-header">
      <div id="active-name" style="color:var(--text-muted)">No active system</div>
      <div id="active-substage"></div>
      <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
        <div id="traj-controls" style="display:none; gap:6px; align-items:center">
          <button onclick="trajStep(-10)" style="background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:2px 7px;border-radius:3px;font-family:var(--mono);font-size:10px;cursor:pointer">&lt;&lt;</button>
          <button onclick="trajStep(-1)"  style="background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:2px 7px;border-radius:3px;font-family:var(--mono);font-size:10px;cursor:pointer">&lt;</button>
          <button onclick="trajPlay()"    style="background:var(--surface2);border:1px solid var(--border2);color:var(--accent);padding:2px 7px;border-radius:3px;font-family:var(--mono);font-size:10px;cursor:pointer" id="play-btn">&#9654;</button>
          <button onclick="trajStep(1)"   style="background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:2px 7px;border-radius:3px;font-family:var(--mono);font-size:10px;cursor:pointer">&gt;</button>
          <button onclick="trajStep(10)"  style="background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:2px 7px;border-radius:3px;font-family:var(--mono);font-size:10px;cursor:pointer">&gt;&gt;</button>
          <label id="live-frame-label" style="display:flex;align-items:center;gap:4px;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--teal);user-select:none;margin-left:4px">
            <input type="checkbox" id="live-frame-chk" checked style="accent-color:var(--teal)"> Frame
          </label>
          <label id="live-sys-label" style="display:flex;align-items:center;gap:4px;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--accent);user-select:none;">
            <input type="checkbox" id="live-sys-chk" checked style="accent-color:var(--accent)"> Sys
          </label>
        </div>
      </div>
    </div>
    <div id="viewer-traj">
      <div id="traj-overlay">
        <div class="overlay-chip" id="frame-chip" hidden>Frame —/—</div>
        <div class="overlay-chip" id="energy-chip" hidden>E = — eV/atom</div>
      </div>
    </div>
    <div id="energy-chart-wrap">
      <div id="energy-label">Energy convergence (eV/atom)</div>
      <canvas id="energy-chart"></canvas>
    </div>
    <!-- SQS center view — shown when SQS tab active -->
    <div id="sqs-center" hidden style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">
      <div id="sqs-center-picker" style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;align-content:start"></div>
      <div id="sqs-center-tiles" hidden style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">
        <!-- Tile-view header -->
        <div style="display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--border);flex-shrink:0">
          <button onclick="sqsShowPicker()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:2px 9px;border-radius:3px;font-family:var(--mono);font-size:10px;cursor:pointer">← comps</button>
          <span id="sqs-center-label" style="font-family:var(--mono);font-size:10px;color:var(--text-dim);flex:1"></span>
          <button id="sqs-grid-toggle" onclick="sqsToggleGrid()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:2px 8px;border-radius:3px;font-family:var(--mono);font-size:10px;cursor:pointer">▾ tiles</button>
        </div>
        <!-- Large preview canvas for selected/live structure -->
        <div id="sqs-preview-wrap" style="flex:0 0 160px;background:#060B10;border-bottom:1px solid var(--border);position:relative;display:flex;align-items:center;justify-content:center">
          <canvas id="sqs-preview-canvas" style="width:100%;height:100%;display:block"></canvas>
          <div id="sqs-preview-label" style="position:absolute;bottom:6px;left:10px;font-family:var(--mono);font-size:9px;color:var(--text-dim);pointer-events:none">click a tile to preview</div>
        </div>
        <!-- 10-tile mini grid (collapsible) -->
        <div id="sqs-grid" style="flex:1;min-height:0;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;align-content:start;scrollbar-width:thin;scrollbar-color:var(--border2) transparent"></div>
      </div>
    </div>
  </div>

  <!-- Right: stage tabs -->
  <div id="panel-right">
    <div class="panel-header" style="padding:0; gap:0; border-bottom:1px solid var(--border);">
      <button class="stage-tab active" id="tab-sqs" onclick="switchTab('sqs')">SQS</button>
      <button class="stage-tab" id="tab-tdb" onclick="switchTab('tdb')">TDB</button>
      <button class="stage-tab" id="tab-plots" onclick="switchTab('plots')">Plots</button>
      <label id="live-sqs-label" style="display:flex;align-items:center;gap:4px;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--text-dim);user-select:none;margin-left:auto;padding:0 8px;">
        <input type="checkbox" id="live-sqs-chk" style="accent-color:#A78BFA"> Live
      </label>
      <button onclick="collapsePanel('right')" title="Collapse" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;padding:0 10px;line-height:1" id="btn-collapse-right">▶</button>
    </div>
    <div id="tab-content-sqs" class="tab-content" style="overflow-y:auto;padding:0">
      <div id="sqs-dir-list" style="padding:6px 0"></div>
    </div>
    <div id="tab-content-tdb" class="tab-content" hidden>
      <div id="tdb-list"></div>
    </div>
    <div id="tab-content-plots" class="tab-content" hidden>
      <div id="plots-strip-right"></div>
    </div>
  </div>

</div>

<!-- Bottom: plot gallery -->
<div id="panel-bottom">

<script>
// ── State ──────────────────────────────────────────────────────────────
const POLL_MS = 2000;
let trajViewer = null;
let sqsDrawn = {};  // viewKey → true once canvas rendered
let selectedSQSSubdir = null; // currently selected composition chip key "dirName|subdir"
let selectedSQSDir = null;    // currently selected dir name (right panel)
let energyChart = null;
let trajFrames = [];
let trajIdx = 0;
let trajPlaying = false;
let trajInterval = null;
let selectedSystem = null;
let lastStatus = null;
let latestSystems = [];
let liveMode = true;   // legacy alias — controls liveFrame
let liveFrame = true;  // auto-advance to latest frame within selected system
let liveSys = true;    // auto-switch to most active system
let liveSQS = false;   // auto-refresh center with best SQS tile each poll
let liveSQSPath = null; // currently displayed SQS bestsqs path

// ── Init 3D viewer ─────────────────────────────────────────────────────
function initTrajViewer() {
  const el = document.getElementById('viewer-traj');
  if (trajViewer) return;
  trajViewer = $3Dmol.createViewer(el, {
    backgroundColor: '#080D14',
    antialias: true,
  });
}

// ── 2D canvas SQS renderer (no WebGL — avoids context limit) ───────────
// Assign evenly-spaced rainbow hues to unique elements; A-first ordering
function buildElemColors(elements) {
  const sorted = [...new Set(elements)].sort();
  const n = sorted.length || 1;
  const map = {};
  sorted.forEach((e, i) => {
    const hue = (i / n) * 360;
    map[e] = `hsl(${hue.toFixed(1)},88%,62%)`;
  });
  return map;
}

function drawXYZ(canvas, xyzText, rotX=0, rotY=0) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#060B10';
  ctx.fillRect(0, 0, W, H);
  const lines = xyzText.trim().split('\n');
  if (lines.length < 3) return;
  const atoms = [];
  for (let i = 2; i < lines.length; i++) {
    const p = lines[i].trim().split(/\s+/);
    if (p.length < 4) continue;
    atoms.push({ e: p[0], x: +p[1], y: +p[2], z: +p[3] });
  }
  if (!atoms.length) return;
  const colorMap = buildElemColors(atoms.map(a => a.e));
  const cx = atoms.reduce((s,a) => s+a.x, 0)/atoms.length;
  const cy = atoms.reduce((s,a) => s+a.y, 0)/atoms.length;
  const cz = atoms.reduce((s,a) => s+a.z, 0)/atoms.length;
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const proj = atoms.map(a => {
    let dx = a.x-cx, dy = a.y-cy, dz = a.z-cz;
    // rotate around Y axis
    const dx2 = dx*cosY + dz*sinY, dz2 = -dx*sinY + dz*cosY;
    // rotate around X axis
    const dy3 = dy*cosX - dz2*sinX, dz3 = dy*sinX + dz2*cosX;
    // isometric-style projection
    const cos30 = Math.sqrt(3)/2, sin30 = 0.5;
    return { e: a.e, sx: (dx2-dy3)*cos30, sy: -(dx2+dy3)*sin30+dz3, depth: dx2+dy3-2*dz3 };
  });
  const sxs = proj.map(a => a.sx), sys = proj.map(a => a.sy);
  const spanX = Math.max(...sxs)-Math.min(...sxs) || 1;
  const spanY = Math.max(...sys)-Math.min(...sys) || 1;
  const pad = 10;
  const sc = Math.min((W-2*pad)/spanX, (H-2*pad)/spanY);
  const midSX = (Math.min(...sxs)+Math.max(...sxs))/2;
  const midSY = (Math.min(...sys)+Math.max(...sys))/2;
  const r = Math.max(2, Math.min(6, sc*0.4));
  proj.sort((a,b) => b.depth-a.depth);
  proj.forEach(({e, sx, sy}) => {
    const px = W/2+(sx-midSX)*sc;
    const py = H/2-(sy-midSY)*sc;
    const base = colorMap[e] || '#FF69B4';
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI*2);
    ctx.fillStyle = base;
    ctx.fill();
    const g = ctx.createRadialGradient(px-r*0.3, py-r*0.35, r*0.05, px, py, r);
    g.addColorStop(0, 'rgba(255,255,255,0.45)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();
  });
}

function initPreviewDrag(cvs) {
  if (cvs._dragInit) return;
  cvs._dragInit = true;
  cvs.style.cursor = 'grab';
  let dragging = false, lx = 0, ly = 0;
  cvs.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; cvs.style.cursor = 'grabbing'; });
  window.addEventListener('mouseup', () => { dragging = false; cvs.style.cursor = 'grab'; });
  window.addEventListener('mousemove', e => {
    if (!dragging || !cvs._xyzData) return;
    cvs._rotY = (cvs._rotY || 0) + (e.clientX - lx) * 0.01;
    cvs._rotX = (cvs._rotX || 0) + (e.clientY - ly) * 0.01;
    lx = e.clientX; ly = e.clientY;
    drawXYZ(cvs, cvs._xyzData, cvs._rotX, cvs._rotY);
  });
}

// ── Energy chart ────────────────────────────────────────────────────────
function initEnergyChart() {
  const ctx = document.getElementById('energy-chart').getContext('2d');
  energyChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{
      data: [],
      borderColor: '#E8A030',
      borderWidth: 1.5,
      pointRadius: 0,
      tension: 0.3,
      fill: { target: 'origin', above: 'rgba(232,160,48,0.05)' },
    }]},
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      layout: { padding: { left: 8, right: 4, top: 4, bottom: 2 } },
      scales: {
        x: {
          display: true,
          ticks: { color: '#5A6880', font: { family: 'JetBrains Mono', size: 8 }, maxTicksLimit: 8 },
          grid: { display: false },
          border: { display: false },
          title: { display: true, text: 'step', color: '#3A4860', font: { family: 'JetBrains Mono', size: 8 } },
        },
        y: {
          grid: { color: '#1E2A3E', lineWidth: 0.5 },
          ticks: { color: '#5A6880', font: { family: 'JetBrains Mono', size: 9 }, maxTicksLimit: 4, padding: 8 },
          border: { display: false },
        },
      },
    },
  });
}

// ── Load XYZ into a 3Dmol viewer ────────────────────────────────────────
function loadXYZ(viewer, xyz, style) {
  viewer.clear();
  viewer.addModel(xyz, 'xyz');
  viewer.setStyle({}, style || {
    sphere: { radius: 0.35, colorscheme: 'Jmol' },
    stick: { radius: 0.08, colorscheme: 'Jmol' },
  });
  viewer.zoomTo();
  viewer.render();
}

// ── Trajectory playback ────────────────────────────────────────────────
function showFrame(idx) {
  if (!trajFrames.length || !trajViewer) return;
  idx = Math.max(0, Math.min(trajFrames.length - 1, idx));
  trajIdx = idx;
  loadXYZ(trajViewer, trajFrames[idx]);
  document.getElementById('frame-chip').hidden = false;
  document.getElementById('frame-chip').textContent = `Frame ${idx + 1}/${trajFrames.length}`;
}

function trajStep(delta) {
  setLiveMode(false);
  showFrame(trajIdx + delta);
}

function trajPlay() {
  if (trajPlaying) {
    clearInterval(trajInterval);
    trajPlaying = false;
    document.getElementById('play-btn').innerHTML = '&#9654;';
  } else {
    trajPlaying = true;
    document.getElementById('play-btn').textContent = '⏹';
    trajInterval = setInterval(() => {
      if (trajIdx >= trajFrames.length - 1) { trajIdx = 0; }
      showFrame(trajIdx + 1);
    }, 120);
  }
}

function setLiveMode(v) {
  liveMode = v; liveFrame = v;
  const lbl = document.getElementById('live-frame-label');
  const chk = document.getElementById('live-frame-chk');
  if (lbl) lbl.style.color = v ? 'var(--teal)' : 'var(--text-dim)';
  if (chk) chk.checked = v;
}
function setLiveSys(v) {
  liveSys = v;
  const lbl = document.getElementById('live-sys-label');
  const chk = document.getElementById('live-sys-chk');
  if (lbl) lbl.style.color = v ? 'var(--accent)' : 'var(--text-dim)';
  if (chk) chk.checked = v;
}
function setLiveSQS(v) {
  liveSQS = v;
  const lbl = document.getElementById('live-sqs-label');
  const chk = document.getElementById('live-sqs-chk');
  if (lbl) { lbl.style.color = v ? '#A78BFA' : 'var(--text-dim)'; lbl.style.fontWeight = v ? '600' : ''; }
  if (chk) chk.checked = v;
}

function liveRefresh(sys) {
  if (sys.has_trajectory && sys.trajectory_paths && sys.trajectory_paths.length) {
    fetch(`/api/trajectory?path=${encodeURIComponent(sys.trajectory_paths[0])}`)
      .then(r => r.json())
      .then(d => {
        if (!d.xyz) return;
        const frames = splitXYZ(d.xyz);
        if (!trajViewer) { initTrajViewer(); }
        if (!trajFrames.length) { document.getElementById('traj-controls').style.display = 'flex'; }
        trajFrames = frames;
        showFrame(frames.length - 1);
      }).catch(() => {});
  } else if (sys.contcar_paths && sys.contcar_paths.length) {
    fetch(`/api/structure?path=${encodeURIComponent(sys.contcar_paths[0])}`)
      .then(r => r.json())
      .then(d => {
        if (!d.xyz) return;
        if (!trajFrames.length || trajFrames[0] !== d.xyz) {
          trajFrames = [d.xyz];
          if (!trajViewer) initTrajViewer();
          showFrame(0);
        }
      }).catch(() => {});
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const fchk = document.getElementById('live-frame-chk');
  if (fchk) fchk.addEventListener('change', e => setLiveMode(e.target.checked));
  const schk = document.getElementById('live-sys-chk');
  if (schk) schk.addEventListener('change', e => setLiveSys(e.target.checked));
  const sqschk = document.getElementById('live-sqs-chk');
  if (sqschk) sqschk.addEventListener('change', e => setLiveSQS(e.target.checked));
});

// Parse multi-frame XYZ into array of single-frame strings
function splitXYZ(text) {
  const lines = text.split('\n');
  const frames = [];
  let i = 0;
  while (i < lines.length) {
    const nStr = lines[i].trim();
    if (!nStr) { i++; continue; }
    const n = parseInt(nStr);
    if (isNaN(n) || n <= 0) { i++; continue; }
    const end = i + 2 + n;
    frames.push(lines.slice(i, end).join('\n'));
    i = end;
  }
  return frames;
}

// ── Select a system to display in center panel ─────────────────────────
function selectSystem(sys) {
  selectedSystem = sys;
  setLiveMode(false);
  document.querySelectorAll('.system-row').forEach(r =>
    r.classList.toggle('active', r.dataset.name === sys.name));
  document.getElementById('active-name').textContent = sys.name;
  document.getElementById('active-name').style.color = 'var(--text)';
  document.getElementById('active-substage').textContent =
    sys.tdb_done ? 'TDB done' : sys.energy_count > 0 ? `${sys.energy_count} energies` : 'queued';

  // Load trajectory if available
  if (sys.has_trajectory && sys.trajectory_paths.length) {
    fetch(`/api/trajectory?path=${encodeURIComponent(sys.trajectory_paths[0])}`)
      .then(r => r.json())
      .then(d => {
        if (d.xyz) {
          trajFrames = splitXYZ(d.xyz);
          document.getElementById('traj-controls').style.display = trajFrames.length > 1 ? 'flex' : 'none';
          initTrajViewer();
          showFrame(trajFrames.length - 1);
        }
      }).catch(() => {});
  } else if (sys.contcar_paths.length) {
    // Show CONTCAR as structure
    fetch(`/api/structure?path=${encodeURIComponent(sys.contcar_paths[0])}`)
      .then(r => r.json())
      .then(d => {
        if (d.xyz) {
          trajFrames = [d.xyz];
          initTrajViewer();
          showFrame(0);
        }
      }).catch(() => {});
  }

  // Load energy data
  fetch(`/api/energy?dir=${encodeURIComponent(sys.path)}`)
    .then(r => r.json())
    .then(entries => {
      if (!entries.length) return;
      const vals = entries.map((e, i) => ({ x: i, y: e.energy }));
      const last = vals[vals.length - 1];
      document.getElementById('energy-chip').hidden = false;
      document.getElementById('energy-chip').textContent = `E = ${last.y.toFixed(4)} eV/atom`;
      energyChart.data.labels = vals.map(v => v.x);
      energyChart.data.datasets[0].data = vals.map(v => v.y);
      energyChart.update('none');
    }).catch(() => {});
}

// ── SQS in-panel preview canvas ────────────────────────────────────────
let sqsPreviewPath = null;

function sqsPreviewTile(path, label) {
  if (sqsPreviewPath === path) return;
  sqsPreviewPath = path;
  liveSQSPath = path; // keep in sync for live-SQS dedup
  const lbl = document.getElementById('sqs-preview-label');
  if (lbl) lbl.textContent = label || path;
  // Highlight active tile
  document.querySelectorAll('.sqs-tile').forEach(t => {
    t.classList.toggle('selected', t.dataset.path === path);
  });
  fetch(`/api/structure?path=${encodeURIComponent(path)}`)
    .then(r => r.json())
    .then(d => {
      if (!d.xyz) return;
      const cvs = document.getElementById('sqs-preview-canvas');
      if (!cvs) return;
      cvs.width = cvs.offsetWidth || 600;
      cvs.height = cvs.offsetHeight || 220;
      cvs._xyzData = d.xyz;
      cvs._rotX = cvs._rotX || 0;
      cvs._rotY = cvs._rotY || 0;
      drawXYZ(cvs, d.xyz, cvs._rotX, cvs._rotY);
      initPreviewDrag(cvs);
    }).catch(() => {});
}

function sqsToggleGrid() {
  const grid = document.getElementById('sqs-grid');
  const btn = document.getElementById('sqs-grid-toggle');
  if (!grid) return;
  const collapsed = grid.hidden;
  grid.hidden = !collapsed;
  if (btn) btn.textContent = collapsed ? '▾ tiles' : '▸ tiles';
}

// ── Panel collapse ─────────────────────────────────────────────────────
const _panelCollapsed = { left: false, right: false, bottom: false };
function collapsePanel(which) {
  const r = document.documentElement;
  _panelCollapsed[which] = !_panelCollapsed[which];
  const c = _panelCollapsed[which];
  if (which === 'left') {
    r.style.setProperty('--col-left', c ? '0px' : '240px');
    const btn = document.getElementById('btn-collapse-left');
    if (btn) btn.textContent = c ? '▶' : '◀';
    document.getElementById('panel-left').style.overflow = 'hidden';
    document.getElementById('edge-left').hidden = !c;
  } else if (which === 'right') {
    r.style.setProperty('--col-right', c ? '0px' : '320px');
    const btn = document.getElementById('btn-collapse-right');
    if (btn) btn.textContent = c ? '◀' : '▶';
    document.getElementById('panel-right').style.overflow = 'hidden';
    document.getElementById('edge-right').hidden = !c;
  } else if (which === 'bottom') {
    const newH = c ? '32px' : '150px';
    r.style.setProperty('--row-bottom', newH);
    document.getElementById('panel-bottom').style.height = newH;
    const btn = document.getElementById('btn-collapse-bottom');
    if (btn) btn.textContent = c ? '▸' : '▾';
  }
}

// Keep loadSQSInCenter for non-SQS-tab context (TDB/trajectory tab)
function loadSQSInCenter(path, label) {
  sqsPreviewTile(path, label);
}

// ── Render SQS tiles ───────────────────────────────────────────────────
function sanitizeId(s) {
  return String(s).replace(/[^a-zA-Z0-9_-]/g, '_');
}

function sqsShowPicker() {
  document.getElementById('sqs-center-picker').hidden = false;
  document.getElementById('sqs-center-tiles').hidden = true;
  selectedSQSSubdir = null;
}

function selectSQSComp(gk, label) {
  selectedSQSSubdir = gk;
  document.getElementById('sqs-center-picker').hidden = true;
  const tv = document.getElementById('sqs-center-tiles');
  tv.hidden = false;
  tv.style.display = 'flex';
  const lbl = document.getElementById('sqs-center-label');
  if (lbl) lbl.textContent = label || gk;
  document.querySelectorAll('.sqs-tile').forEach(el => {
    el.hidden = el.dataset.gk !== gk;
  });
}

function renderSQSDirList(sqsDirs) {
  const list = document.getElementById('sqs-dir-list');
  if (!list) return;
  const names = sqsDirs.map(d => d.name);
  // auto-select first dir if none selected or selection gone
  if (!selectedSQSDir || !names.includes(selectedSQSDir)) {
    selectedSQSDir = names[0] || null;
    selectedSQSSubdir = null; // reset composition when dir changes
  }
  // rebuild if set changed
  const existing = new Set([...list.querySelectorAll('.sqs-dir-row')].map(r => r.dataset.name));
  if (names.some(n => !existing.has(n)) || existing.size !== names.length) {
    list.innerHTML = '';
    names.forEach(name => {
      const row = document.createElement('div');
      row.className = 'sqs-dir-row';
      row.dataset.name = name;
      row.style.cssText = 'padding:6px 14px;cursor:pointer;font-family:var(--mono);font-size:11px;border-left:2px solid transparent;transition:background 0.1s;';
      row.textContent = name;
      row.addEventListener('click', () => {
        if (selectedSQSDir !== name) {
          selectedSQSDir = name;
          selectedSQSSubdir = null; // reset composition
          sqsShowPicker();
        }
        list.querySelectorAll('.sqs-dir-row').forEach(r => {
          const sel = r.dataset.name === selectedSQSDir;
          r.style.borderLeftColor = sel ? 'var(--teal)' : 'transparent';
          r.style.background = sel ? 'var(--surface)' : '';
          r.style.color = sel ? 'var(--text)' : 'var(--text-dim)';
        });
      });
      list.appendChild(row);
    });
  }
  // sync highlight
  list.querySelectorAll('.sqs-dir-row').forEach(r => {
    const sel = r.dataset.name === selectedSQSDir;
    r.style.borderLeftColor = sel ? 'var(--teal)' : 'transparent';
    r.style.background = sel ? 'var(--surface)' : '';
    r.style.color = sel ? 'var(--text)' : 'var(--text-dim)';
  });
}

function renderSQS(sqsDirs) {
  renderSQSDirList(sqsDirs);
  // filter to selected dir only
  const filteredDirs = selectedSQSDir ? sqsDirs.filter(d => d.name === selectedSQSDir) : sqsDirs;
  const grid = document.getElementById('sqs-grid');
  const picker = document.getElementById('sqs-center-picker');

  if (!filteredDirs.length) {
    picker.innerHTML = '<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;height:60px;font-family:var(--mono);font-size:10px;color:var(--text-dim)">No active SQS runs</div>';
    picker.hidden = false;
    document.getElementById('sqs-center-tiles').hidden = true;
    const dl = document.getElementById('sqs-dir-label'); if (dl) dl.textContent = '—';
    return;
  }

  const activeNames = filteredDirs.filter(d => d.runs.length).map(d => d.name);
  const dl2 = document.getElementById('sqs-dir-label'); if (dl2) dl2.textContent = activeNames.length ? activeNames.join(', ') : filteredDirs[filteredDirs.length-1].name;

  const allRuns = [];
  filteredDirs.forEach(dir => {
    if (dir.runs.length) {
      dir.runs.forEach(r => allRuns.push({...r, dirName: dir.name}));
    } else {
      allRuns.push({ip: 0, dirName: dir.name, subdir: '', waiting: true, bestsqs_path: null, objective: null});
    }
  });

  if (!allRuns.length) {
    picker.innerHTML = `<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;height:80px;font-family:var(--mono);font-size:10px;color:var(--text-dim)">${filteredDirs[0].name} — waiting…</div>`;
    picker.hidden = false;
    document.getElementById('sqs-center-tiles').hidden = true;
    return;
  }

  const bestByGroup = {};
  allRuns.forEach(r => {
    const gk = `${r.dirName}|${r.subdir}`;
    if (r.objective != null && isFinite(r.objective)) {
      bestByGroup[gk] = Math.min(bestByGroup[gk] ?? Infinity, r.objective);
    }
  });

  const groups = {};
  const groupOrder = [];
  allRuns.forEach(r => {
    const gk = `${r.dirName}|${r.subdir}`;
    if (!groups[gk]) { groups[gk] = { dirName: r.dirName, subdir: r.subdir, runs: [] }; groupOrder.push(gk); }
    groups[gk].runs.push(r);
  });

  // Always rebuild/update picker cards (even if hidden) so new compositions appear
  const existingCards = new Set([...picker.querySelectorAll('.sqs-comp-card')].map(c => c.dataset.gk));
  const currentKeys = new Set(groupOrder);
  if ([...currentKeys].some(k => !existingCards.has(k)) || existingCards.size !== currentKeys.size) {
    picker.innerHTML = '';
    groupOrder.forEach(gk => {
      const { dirName, subdir } = groups[gk];
      const label = subdir || dirName;
      const best = bestByGroup[gk];
      const card = document.createElement('div');
      card.className = 'sqs-comp-card';
      card.dataset.gk = gk;
      card.style.cssText = 'background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:14px 12px;cursor:pointer;transition:border-color 0.15s;';
      card.innerHTML = `<div style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px">${dirName}</div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--accent);margin-bottom:4px">${subdir || '—'}</div>
        <div id="card-obj-${sanitizeId(gk)}" style="font-family:var(--mono);font-size:9px;color:var(--teal)">${best != null && isFinite(best) ? `best: ${best.toFixed(4)}` : 'running…'}</div>`;
      card.addEventListener('mouseenter', () => { card.style.borderColor = 'var(--border2)'; });
      card.addEventListener('mouseleave', () => { card.style.borderColor = selectedSQSSubdir === gk ? 'var(--teal)' : 'var(--border)'; });
      card.addEventListener('click', () => selectSQSComp(gk, `${dirName} / ${subdir || ''}`.trim()));
      picker.appendChild(card);
    });
  } else {
    groupOrder.forEach(gk => {
      const el = document.getElementById(`card-obj-${sanitizeId(gk)}`);
      const best = bestByGroup[gk];
      if (el) el.textContent = best != null && isFinite(best) ? `best: ${best.toFixed(4)}` : 'running…';
      const card = picker.querySelector(`.sqs-comp-card[data-gk="${gk}"]`);
      if (card) card.style.borderColor = selectedSQSSubdir === gk ? 'var(--teal)' : 'var(--border)';
    });
  }

  // Auto-select if only one composition
  if (!selectedSQSSubdir && groupOrder.length === 1) {
    selectSQSComp(groupOrder[0], groups[groupOrder[0]].subdir || groups[groupOrder[0]].dirName);
  }

  if (!selectedSQSSubdir) return;

  const gk = selectedSQSSubdir;
  if (!groups[gk]) { sqsShowPicker(); return; }
  const { dirName, subdir, runs } = groups[gk];

  picker.hidden = true;
  document.getElementById('sqs-center-tiles').hidden = false;
  document.getElementById('sqs-center-tiles').style.display = 'flex';

  runs.forEach(run => {
    const safeKey = sanitizeId(`${run.dirName}-${run.subdir}-${run.ip}`);
    const tileId = `sqs-tile-${safeKey}`;
    const viewerId = `sqs-v-${safeKey}`;
    const objId = `obj-${safeKey}`;
    const viewKey = safeKey;

    let tile = document.getElementById(tileId);
    if (!tile) {
      tile = document.createElement('div');
      tile.id = tileId;
      tile.className = 'sqs-tile';
      tile.dataset.gk = gk;
      if (run.bestsqs_path) tile.dataset.path = run.bestsqs_path;
      if (!run.waiting && run.bestsqs_path) {
        tile.addEventListener('click', () => {
          setLiveSQS(false);
          sqsPreviewPath = null; // force redraw
          sqsPreviewTile(run.bestsqs_path, `#${run.ip} — ${run.subdir}`);
        });
      }
      tile.innerHTML = run.waiting
        ? `<div class="sqs-tile-header"><span class="sqs-tile-id">${dirName}</span></div><div class="sqs-viewer-wrap"><div class="sqs-no-data">waiting…</div></div>`
        : `<div class="sqs-tile-header">
            <span class="sqs-tile-id">#${run.ip}</span>
            <span class="sqs-obj" id="${objId}">—</span>
           </div>
           <div class="sqs-viewer-wrap">
             ${run.bestsqs_path
               ? `<canvas id="${viewerId}" style="width:100%;height:100%;display:block"></canvas>`
               : `<div class="sqs-no-data">waiting…</div>`}
           </div>`;
      grid.appendChild(tile);
    }

    if (!run.waiting) {
      const isBest = isFinite(bestByGroup[gk] ?? Infinity) && run.objective === bestByGroup[gk];
      tile.className = `sqs-tile${isBest ? ' best' : ''}`;
      tile.dataset.gk = gk;
      const objEl = document.getElementById(objId);
      if (objEl && run.objective != null) objEl.textContent = run.objective.toFixed(4);

      if (run.bestsqs_path && !sqsDrawn[viewKey]) {
        sqsDrawn[viewKey] = true;
        const vpath = run.bestsqs_path;
        fetch(`/api/structure?path=${encodeURIComponent(vpath)}`)
          .then(r => r.json())
          .then(d => {
            if (!d.xyz) return;
            const cvs = document.getElementById(viewerId);
            if (!cvs) return;
            cvs.width = cvs.offsetWidth || 160;
            cvs.height = cvs.offsetHeight || 120;
            drawXYZ(cvs, d.xyz);
          }).catch(() => {});
      }
    }
  });
}

// ── Update stage pills ─────────────────────────────────────────────────
function updateStages(stages, cfgStages) {
  document.querySelectorAll('.stage-pill').forEach(pill => {
    const key = pill.dataset.stage;
    const enabled = cfgStages ? cfgStages[key] !== false : true;
    if (!enabled) { pill.className = 'stage-pill'; return; }
    const s = stages[key] || {};
    if (key === 'tdb_fitting') {
      if (s.all_done) pill.className = 'stage-pill done';
      else if (s.started) pill.className = 'stage-pill running';
      else pill.className = 'stage-pill';
      const countEl = pill.querySelector('.dot');
      if (s.started && !s.all_done && s.systems_total)
        pill.title = `${s.systems_done}/${s.systems_total} systems`;
    } else if (key === 'sqs_generation') {
      pill.className = s.started ? (stages.tdb_fitting?.started ? 'stage-pill done' : 'stage-pill running') : 'stage-pill';
    } else if (key === 'phase_diagrams') {
      pill.className = s.plot_count > 0 ? 'stage-pill done' : (s.started ? 'stage-pill running' : 'stage-pill');
    } else {
      pill.className = s.started ? 'stage-pill running' : 'stage-pill';
    }
  });
}

// ── Composition drill-down ────────────────────────────────────────────
let openCompSystem = null;
function loadCompositions(sys, row) {
  // Toggle: clicking same system again collapses
  if (openCompSystem === sys.name) {
    const el = document.getElementById(`comp-list-${sys.name}`);
    if (el) el.style.display = 'none';
    openCompSystem = null;
    return;
  }
  // Collapse any open list
  if (openCompSystem) {
    const prev = document.getElementById(`comp-list-${openCompSystem}`);
    if (prev) prev.style.display = 'none';
  }
  openCompSystem = sys.name;
  const compList = document.getElementById(`comp-list-${sys.name}`);
  if (!compList) return;
  compList.style.display = 'flex';
  compList.innerHTML = `<div style="padding:4px 10px;font-family:var(--mono);font-size:9px;color:var(--text-dim)">loading…</div>`;

  fetch(`/api/compositions?dir=${encodeURIComponent(sys.path)}`)
    .then(r => r.json())
    .then(comps => {
      if (!comps.length) {
        compList.innerHTML = `<div style="padding:4px 10px;font-family:var(--mono);font-size:9px;color:var(--text-dim)">no structures yet</div>`;
        return;
      }
      compList.innerHTML = '';
      comps.forEach(comp => {
        const div = document.createElement('div');
        div.style.cssText = 'padding:3px 10px;font-family:var(--mono);font-size:9px;cursor:pointer;color:var(--text-dim);border-bottom:1px solid var(--border);';
        div.textContent = comp.name + (comp.energy != null ? `  ${comp.energy.toFixed(4)} eV` : '');
        div.addEventListener('mouseenter', () => div.style.color = 'var(--accent)');
        div.addEventListener('mouseleave', () => div.style.color = 'var(--text-dim)');
        div.addEventListener('click', e => {
          e.stopPropagation();
          setLiveMode(false);
          // Load composition CONTCAR into center viewer
          fetch(`/api/structure?path=${encodeURIComponent(comp.contcar_path)}`)
            .then(r => r.json())
            .then(d => {
              if (!d.xyz) return;
              trajFrames = [d.xyz];
              document.getElementById('active-name').textContent = `${sys.name} / ${comp.name}`;
              document.getElementById('active-substage').textContent = comp.energy != null ? `${comp.energy.toFixed(4)} eV` : '';
              initTrajViewer();
              showFrame(0);
              document.getElementById('traj-controls').style.display = 'none';
            }).catch(() => {});
          // If trajectory available, load that instead
          if (comp.has_trajectory && comp.trajectory_paths.length) {
            fetch(`/api/trajectory?path=${encodeURIComponent(comp.trajectory_paths[0])}`)
              .then(r => r.json())
              .then(d => {
                if (!d.xyz) return;
                const frames = splitXYZ(d.xyz);
                trajFrames = frames;
                initTrajViewer();
                showFrame(frames.length - 1);
                document.getElementById('traj-controls').style.display = frames.length > 1 ? 'flex' : 'none';
              }).catch(() => {});
          }
        });
        compList.appendChild(div);
      });
    }).catch(() => {
      compList.innerHTML = `<div style="padding:4px 10px;font-family:var(--mono);font-size:9px;color:var(--red)">error loading</div>`;
    });
}

// ── Render system list ─────────────────────────────────────────────────
function renderSystems(systems) {
  latestSystems = systems;
  const list = document.getElementById('systems-list');
  document.getElementById('sys-count').textContent = `${systems.filter(s => s.tdb_done).length}/${systems.length}`;

  systems.forEach(sys => {
    const rowId = `sys-row-${sys.name}`;
    let row = document.getElementById(rowId);
    if (!row) {
      row = document.createElement('div');
      row.id = rowId;
      row.className = 'system-row';
      row.dataset.name = sys.name;
      row.innerHTML = `
        <span class="system-name">${sys.name}</span>
        <span class="system-badge" id="badge-${sys.name}"></span>`;
      // Always look up current data by name so clicks after new CONTCAR/trajectory appear work correctly
      row.addEventListener('click', () => {
        const current = latestSystems.find(s => s.name === sys.name) || sys;
        selectSystem(current);
        loadCompositions(current, row);
      });
      list.appendChild(row);
      // Composition sub-list container (hidden by default)
      const compList = document.createElement('div');
      compList.id = `comp-list-${sys.name}`;
      compList.style.cssText = 'display:none; flex-direction:column; background:var(--surface2); border-left:2px solid var(--border2); margin-left:10px;';
      list.appendChild(compList);
    }
    // Update badge
    const badge = document.getElementById(`badge-${sys.name}`);
    if (badge) {
      if (sys.tdb_done) { badge.className = 'system-badge done'; badge.textContent = 'done'; }
      else if (sys.energy_count > 0) { badge.className = 'system-badge running'; badge.textContent = `${sys.energy_count}E`; }
      else { badge.className = 'system-badge queued'; badge.textContent = 'queued'; }
    }
    // Auto-select most active
    if (!selectedSystem && sys.energy_count > 0 && !sys.tdb_done) selectSystem(sys);
  });
}

// ── Render plots strip ─────────────────────────────────────────────────
function renderPlots(plots) {
  const strip = document.getElementById('plots-strip');
  document.getElementById('plot-count').textContent = `${plots.length} files`;
  if (!plots.length) { strip.innerHTML = '<div class="no-plots">No outputs yet</div>'; return; }

  plots.slice(0, 40).forEach(plot => {
    const thumbId = `thumb-${plot.path.replace(/\W/g, '_')}`;
    if (document.getElementById(thumbId)) return;
    const div = document.createElement('div');
    div.id = thumbId;
    div.className = 'plot-thumb';
    div.innerHTML = `<img src="" alt="${plot.name}"><div class="plot-thumb-label">${plot.name}</div>`;
    div.addEventListener('click', () => openModal(plot.path));
    strip.querySelector('.no-plots')?.remove();
    strip.appendChild(div);
    // Lazy-load image
    fetch(`/api/image?path=${encodeURIComponent(plot.path)}`)
      .then(r => r.json())
      .then(d => { if (d.data) div.querySelector('img').src = `data:${d.mime};base64,${d.data}`; })
      .catch(() => {});
  });
}

// ── Modal ──────────────────────────────────────────────────────────────
function openModal(path) {
  fetch(`/api/image?path=${encodeURIComponent(path)}`)
    .then(r => r.json())
    .then(d => {
      if (!d.data) return;
      document.getElementById('modal-img').src = `data:${d.mime};base64,${d.data}`;
      document.getElementById('modal').classList.add('open');
    }).catch(() => {});
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Log ────────────────────────────────────────────────────────────────
function toggleLog() {
  const panel = document.getElementById('log-panel');
  const btn = document.getElementById('log-toggle');
  const hidden = panel.style.display === 'none';
  panel.style.display = hidden ? '' : 'none';
  btn.textContent = hidden ? '▾' : '▸';
}

function renderLog(lines) {
  const panel = document.getElementById('log-panel');
  panel.innerHTML = lines.map(l => {
    let cls = 'log-line';
    if (/error|fail|traceback/i.test(l)) cls += ' red';
    else if (/done|complete|success|finish/i.test(l)) cls += ' green';
    else if (/running|start|mcsqs|relaxing|fitting/i.test(l)) cls += ' accent';
    return `<div class="${cls}">${escHtml(l)}</div>`;
  }).join('');
  panel.scrollTop = panel.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Stage tabs ─────────────────────────────────────────────────────────
function switchTab(name) {
  ['sqs', 'tdb', 'plots'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === name);
    document.getElementById(`tab-content-${t}`).hidden = t !== name;
  });
  const sqsCenter = document.getElementById('sqs-center');
  const viewerTraj = document.getElementById('viewer-traj');
  const energyWrap = document.getElementById('energy-chart-wrap');
  if (name === 'sqs') {
    sqsCenter.hidden = false;
    sqsCenter.style.display = 'flex';
    viewerTraj.hidden = true;
    energyWrap.hidden = true;
  } else {
    sqsCenter.hidden = true;
    viewerTraj.hidden = false;
    energyWrap.hidden = false;
  }
}

// ── TDB tab ────────────────────────────────────────────────────────────
function renderTDB(systems) {
  const list = document.getElementById('tdb-list');
  if (!list) return;
  list.innerHTML = '';
  (systems || []).forEach(sys => {
    const row = document.createElement('div');
    row.className = 'tdb-row';
    const badge = sys.tdb_done
      ? `<span class="tdb-badge done">done</span>`
      : sys.energy_count > 0
        ? `<span class="tdb-badge running">${sys.energy_count}E</span>`
        : `<span class="tdb-badge queued">queued</span>`;
    row.innerHTML = `<span class="tdb-name">${escHtml(sys.name)}</span>${badge}`;
    row.addEventListener('click', () => {
      const current = latestSystems.find(s => s.name === sys.name) || sys;
      selectSystem(current);
    });
    list.appendChild(row);
  });
}

// ── Plots tab (right panel) ────────────────────────────────────────────
function renderPlotsRight(plots) {
  const strip = document.getElementById('plots-strip-right');
  if (!strip) return;
  (plots || []).slice(0, 30).forEach(plot => {
    const id = `rthumb-${plot.path.replace(/\W/g, '_')}`;
    if (document.getElementById(id)) return;
    const div = document.createElement('div');
    div.id = id;
    div.className = 'plot-thumb-right';
    div.innerHTML = `<img src="/api/image?path=${encodeURIComponent(plot.path)}" loading="lazy" onerror="this.style.display='none'"><div class="plot-name">${escHtml(plot.rel || plot.name || '')}</div>`;
    div.addEventListener('click', () => openModal(plot.path));
    strip.appendChild(div);
  });
}

// ── Poll ───────────────────────────────────────────────────────────────
async function poll() {
  try {
    const [statusRes, sqsRes, plotsRes, logRes] = await Promise.all([
      fetch('/api/status').then(r => r.json()),
      fetch('/api/sqs').then(r => r.json()),
      fetch('/api/plots').then(r => r.json()),
      fetch('/api/log').then(r => r.json()),
    ]);

    lastStatus = statusRes;
    updateStages(statusRes.stages, null);
    renderSystems(statusRes.systems || []);
    renderTDB(statusRes.systems || []);
    renderSQS(sqsRes || []);
    renderPlots(plotsRes || []);
    renderPlotsRight(plotsRes || []);
    renderLog(logRes.lines || []);
    // Live sys: auto-switch to the most active system
    if (liveSys) {
      const active = (statusRes.systems || []).find(s => s.energy_count > 0 && !s.tdb_done)
        || (statusRes.systems || []).find(s => !s.tdb_done)
        || (statusRes.systems || [])[0];
      if (active && (!selectedSystem || selectedSystem.name !== active.name)) {
        selectedSystem = active;
        document.querySelectorAll('.system-row').forEach(r =>
          r.classList.toggle('active', r.dataset.name === active.name));
        document.getElementById('active-name').textContent = active.name;
        document.getElementById('active-name').style.color = 'var(--text)';
        document.getElementById('active-substage').textContent =
          active.tdb_done ? 'TDB done' : active.energy_count > 0 ? `${active.energy_count} energies` : 'queued';
      }
    }
    // Live SQS: auto-preview best-objective tile each poll
    if (liveSQS && sqsRes && sqsRes.length) {
      let bestRun = null, bestObj = Infinity;
      sqsRes.forEach(dir => (dir.runs || []).forEach(r => {
        // if a composition is selected, limit to that group; else search all
        const gk = `${dir.name}|${r.subdir}`;
        if (selectedSQSSubdir && gk !== selectedSQSSubdir) return;
        if (r.bestsqs_path && r.objective != null && r.objective < bestObj) {
          bestObj = r.objective; bestRun = r;
        }
      }));
      // fallback: no match in selection, search all
      if (!bestRun) {
        sqsRes.forEach(dir => (dir.runs || []).forEach(r => {
          if (r.bestsqs_path && r.objective != null && r.objective < bestObj) {
            bestObj = r.objective; bestRun = r;
          }
        }));
      }
      if (bestRun) {
        const label = `#${bestRun.ip} — ${bestRun.subdir} (obj ${bestObj.toFixed(4)})`;
        if (bestRun.mtime !== window._liveSQSMtime) {
          window._liveSQSMtime = bestRun.mtime;
          sqsPreviewPath = null;
        }
        sqsPreviewTile(bestRun.bestsqs_path, label);
      }
    }

    // Live frame: refresh trajectory/CONTCAR for selected system and jump to latest frame
    if (liveFrame && selectedSystem) {
      const fresh = latestSystems.find(s => s.name === selectedSystem.name) || selectedSystem;
      liveRefresh(fresh);
    }

    const now = new Date();
    document.getElementById('refresh-badge').textContent =
      `updated ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  } catch {
    document.getElementById('refresh-badge').textContent = 'server unreachable';
  }
}

// ── Boot ───────────────────────────────────────────────────────────────
initTrajViewer();
initEnergyChart();
switchTab('sqs');
poll();
setInterval(poll, POLL_MS);
</script>
