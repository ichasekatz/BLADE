[stages]
sqs_generation  = true
tdb_fitting     = true
phase_diagrams  = true
oxide_database  = true
oxidation_graphs = true

# ── Elements ──────────────────────────────────────────────────────────────────
# Define your element pool once here; all stages inherit these values.
# Override per-stage inside that stage's table (e.g. add primary = [...] under [tdb]).
[elements]
primary       = ["Zr", "Hf", "Ta", "Cr", "Ti", "V", "Nb", "Mo", "W"]
secondary     = []
primary_min   = 2
primary_max   = 3
secondary_min = 0
secondary_max = 0

# ── Paths ──────────────────────────────────────────────────────────────────────
# blade_root is auto-detected as the parent of the examples/ directory.
# Only set these if your layout differs from the defaults.
[paths]
sqsdb_dir  = "/path/to/atat/data/sqsdb"
# scraps_repo = "/path/to/SCRAPS/scraps-perpair"   # required only when tdb.sqs_method = "scraps"

# ── TDB fitting ───────────────────────────────────────────────────────────────
[tdb]
sqs_method         = "mcsqs"   # "mcsqs" or "scraps"
level              = 6
skip_existing      = true      # skip SQS, TDB, and plots when outputs already exist
run_movie          = false     # generate MP4 trajectory videos (requires FFmpeg)
mlip               = "orb"
liquid             = false
comps_folder       = "Comps"
# Override element pool for TDB only (inherits from [elements] by default):
# primary     = ["Cr", "Hf", "Mo"]
# primary_min = 2
# primary_max = 3

[mlip_kwargs]
steps  = 1000
device = "cuda"  # "cpu" if no GPU available — applies to both TDB and database stages

[tdb_fit]
fmax             = 0.001
t_min            = 298.15
t_max            = 10000.0
track_trajectory = false   # write .xyz trajectory during MLIP relaxation (for dashboard viewer)

[tdb_sqs]
time          = 30    # seconds per mcsqs run
wr            = 20
wn            = 0.75
wd            = 1
parallel_runs = 10

# ── SQS composition levels ────────────────────────────────────────────────────
# Each row defines one level: the compositions (site fractions) and sublattice
# letters to generate SQS structures for. level must match tdb.level or lower.
tdb_sqs_levels = [
    { level = 0, compositions = [[1.0, 0.0]],                     letter = ["a"] },
    { level = 1, compositions = [[0.5, 0.5]],                     letter = ["a"] },
    { level = 2, compositions = [[0.75, 0.25]],                   letter = ["a"] },
    { level = 3, compositions = [[0.33333, 0.33333, 0.33333]],    letter = ["a"] },
    { level = 4, compositions = [[0.5, 0.25, 0.25]],              letter = ["a"] },
    { level = 5, compositions = [[0.875, 0.125], [0.625, 0.375]], letter = ["a"] },
    { level = 6, compositions = [[0.75, 0.125, 0.125]],           letter = ["a"] },
]

# ── Phase prototype ───────────────────────────────────────────────────────────
[phase]
key              = "HEDB1"
generator_name   = "HEDB"
a                = 3.0624
b                = 3.0624
c                = 3.2392
alpha            = 90
beta             = 90
gamma            = 120
supercell_size   = [4, 3, 2]
use_average_lattice = true
# average_elements = { elements = ["Cr", "Hf"], a = "a", b = "a", c = "a" }
vectors = """1 0 0
0 1 0
0 0 1
"""
coords = """0.000000 0.000000 0.000000 a
0.333333 0.666667 0.500000 B
0.666667 0.333333 0.500000 B
"""

# ── ATAT/model input files ────────────────────────────────────────────────────
# Omit a key to keep the generated default. TOML multiline strings preserve
# the complete input file exactly.
[tdb_inputs.terms_in]
HEDB1   = "1,0:1,0\n2,2:1,0\n"
HEDB1_2 = "1,0:1,0\n2,2:1,0\n"
HEDB1_3 = "1,0:1,0\n2,2:1,0\n3,0:1,0\n"

# [tdb_inputs.mult_in]
# HEDB1 = "a=1\tb=2"

# [tdb_inputs.sqsgen_in]
# HEDB1 = "level=0\ta=1\tb=1\nlevel=1\ta=0.5,0.5\tb=1\n"

# ── Per-site element and composition overrides ────────────────────────────────
# Site form assigns elements, a constant flag, and an optional ordered
# composition to a specific phase/sublattice.
# [tdb_inputs.sites.HEDB1.a]
# elements    = ["Cr", "Hf"]
# constant    = true
# composition = [0.75, 0.25]

# Sublattice-map form (element list only, no composition):
# [tdb_inputs.sublattice_map.HEDB1]
# a = ["Cr", "Hf", "Mo", "V"]

# Fixed-composition form (element order follows sublattice_map):
# [tdb_inputs.fixed_compositions]
# a = [0.5, 0.5]

# ── Per-system overrides ──────────────────────────────────────────────────────
# System names are order-independent (CrHf and HfCr are the same system).
# [tdb_system_overrides.CrHf.sites.HEDB1.a]
# elements    = ["Cr", "Hf"]
# constant    = true
# composition = [0.75, 0.25]

# [tdb_system_overrides.CrHf.sublattice_map.HEDB1]
# a = ["Cr", "Hf"]
# [tdb_system_overrides.CrHf.fixed_compositions]
# a = [0.75, 0.25]

# ── Phase diagram plots ───────────────────────────────────────────────────────
[phase_plots]
comps_folder  = "Comps"
output_folder = "Phase_Diagrams"
# systems = ["CrHfMo"]   # optional: limit to specific systems (derived from [elements] by default)
t_start        = 200
t_end          = 2000
t_step         = 200
make_gif       = true
gif_t_step     = 10
fixed_elements = ["B"]
metal_fraction = 0.3333333333333333

# ── Phase grid video ──────────────────────────────────────────────────────────
[phase_grid]
t_start = 200
t_end   = 2000
t_step  = 10

# ── Oxidation database ────────────────────────────────────────────────────────
[database]
# Inherits element pool from [elements] by default.
fixed_elements         = ["B"]
oxygen_element         = "O"
mlip                   = "orb"
run_compositions       = true
run_download           = true
run_energies           = true
run_database           = true
api_key_env            = "MP_API_KEY"   # name of env var holding your Materials Project key

# ── Oxidation calculations ────────────────────────────────────────────────────
[oxidation]
mode                        = "batch"   # "batch" or "single"
phase_element               = "B"
phase_element_stoichiometry = 2.0
mixed_phase_subdir          = "blade"
fixed_phases_subdir         = "ORB"

[oxidation_batch]
# systems = ["CrHfB"]   # optional: limit to specific systems (discovers all by default)
run_calculations          = true
run_plots                 = true
run_scan                  = true
run_muO_x_map             = true
run_onset                 = true
run_3d_onset              = true
run_animations            = true
run_composition_slices    = true
run_composition_slice_muT = true
skip_if_tables_exist      = true
skip_if_analysis_exists   = true
temperature_range         = [250, 2000, 250]
mu_o_range                = [-10.0, -4.0, 0.1]
scan_x                    = 0.5
scan_T                    = [700, 1270, 2000, 2500]
scan_mu_o_range           = [-10.0, -4.0, 0.05]
map_x_range               = [0.0, 1.0, 0.01]
slice_remainder_ratios    = [0.0, 0.25, 0.3333333333333333, 0.5, 0.6666666666666666, 0.75, 1.0]
slice_muT_comp_step       = 0.1
onset_comp_step_binary    = 0.02
onset_comp_step_ternary   = 0.025
onset_comp_step_nary      = 0.1
onset_threshold           = 1e-8
