[stages]
sqs_generation   = true
tdb_fitting      = true
phase_diagrams   = true
oxide_database   = false
oxidation_graphs = false

# ── Global system filter ───────────────────────────────────────────────────────
# Uncomment to limit all stages to specific named systems.
# systems = ["CrHfB", "MoWB"]

# ── Elements ──────────────────────────────────────────────────────────────────
# Define your element pool once here; all stages inherit these values.
[elements]
primary       = ["Hf", "Ta"]
secondary     = []
primary_min   = 2
primary_max   = 2
secondary_min = 0
secondary_max = 0

# ── Paths ─────────────────────────────────────────────────────────────────────
# blade_root is auto-detected as the parent of the examples/ directory.
# Only set these if your layout differs from the defaults.
[paths]
sqsdb_dir  = "/Users/chasekatz/Desktop/School/Research/PhaseForge/PhaseForge/atat/data/sqsdb"
scraps_repo  = "/Users/chasekatz/Desktop/School/Research/SCRAPS/scraps-perpair-arroyave"   # required only when tdb.sqs_method = "scraps"
# mscraps_repo = "/path/to/m_scraps"                # required only when tdb.sqs_method = "mscraps"

# ── TDB fitting ───────────────────────────────────────────────────────────────
[tdb]
sqs_method         = "scraps"   # "mcsqs", "scraps", or "mscraps"
level              = 1
skip_existing      = true      # skip SQS, TDB, and plots when outputs already exist
run_movie          = false     # generate MP4 trajectory videos (requires FFmpeg)
mlip               = "orb"
liquid             = false
comps_folder       = "Comps"

[mlip_kwargs]
steps  = 1000
device = "cpu"   # "cpu" if no GPU — applies to both TDB and database stages

[tdb_fit]
fmax             = 0.001
t_min            = 298.15
t_max            = 10000.0
track_trajectory = true    # write .xyz trajectory during MLIP relaxation (for dashboard viewer)

[tdb_sqs]
time          = 30    # seconds per mcsqs run
wr            = 20
wn            = 0.75
wd            = 1
parallel_runs = 10

# ── SCRAPS SQS options (used when tdb.sqs_method = "scraps") ─────────────────
# [tdb_scraps]
# bin                      = "/path/to/scraps-perpair/SCRAPs/scraps"
# tools                    = "/path/to/scraps-perpair/tools"
# ranks                    = 10
# auto_budget              = 3      # 1=basic, 2=thorough, 3=exhaustive
# max_shellnum             = 4      # max Warren-Cowley shell number
# fix_multibasis_sublattice = true  # per-atom spectators for multi-basis sublattices

# ── m_scraps SQS options (used when tdb.sqs_method = "mscraps") ──────────────
# [tdb_mscraps]
# bin                      = "/path/to/m_scraps/SCRAPs/scraps"
# ranks                    = 10
# auto_budget              = 3          # 1=basic, 2=thorough, 3=exhaustive
# max_shellnum             = 4          # max Warren-Cowley shell number
# fix_multibasis_sublattice = true      # per-atom spectators for multi-basis sublattices
# mc_kernel                = "sa"       # "sa" (simulated annealing) or "pt" (parallel tempering)
# figure_objective         = "minimize" # "minimize" or "match"
# figure_wd                = 1.0        # distance weight for figure objective
# figure_wn                = 0.75       # neighbour-count weight
# figure_wr                = 1.0        # rank weight
# figure_tol               = 1e-4       # convergence tolerance
#
# SRO targets: list of [species_i, species_j, shell, alpha] (0-based species indices)
# sro_targets = [[0, 1, 1, -0.5]]
#
# Figure cutoff distances in Å for higher-order cluster correlations
# figure_cutoffs = [4.5, 6.0]
#
# Species indices included in figure targets (None = all species)
# figure_species = [0, 1]

# ── SQS composition levels ────────────────────────────────────────────────────
# Each row defines one level: the compositions (site fractions) and sublattice
# letters to generate SQS structures for. level must match tdb.level or lower.
tdb_sqs_levels = [
    { level = 0, compositions = [[1.0, 0.0]],                     letter = ["a"] },
    { level = 1, compositions = [[0.625, 0.375]], 				  letter = ["a"] },
]

# ── Phase prototype ───────────────────────────────────────────────────────────
[phase]
key              = "HEDB1"
generator_name   = "HEDB"
a                = 3.0624
b                = 3.0624
c                = 3.2392
alpha            = 90
beta             = 90
gamma            = 120
supercell_size   = [4, 4, 3]
use_average_lattice = true
# average_elements = { elements = ["Cr", "Hf"], a = "a", b = "a", c = "a" }
vectors = """1 0 0
0 1 0
0 0 1
"""
coords = """0.000000 0.000000 0.000000 a
0.333333 0.666667 0.500000 B
0.666667 0.333333 0.500000 B
"""

# ── ATAT/model input files ────────────────────────────────────────────────────
# Omit a key to keep the generated default. TOML multiline strings preserve
# the complete input file exactly.
[tdb_inputs.terms_in]
HEDB1   = "1,0:1,0\n2,2:1,0\n"
HEDB1_2 = "1,0:1,0\n2,2:1,0\n"
HEDB1_3 = "1,0:1,0\n2,2:1,0\n3,0:1,0\n"

# [tdb_inputs.mult_in]
# HEDB1 = "a=1\tb=2"

# [tdb_inputs.sqsgen_in]
# HEDB1 = "level=0\ta=1\tb=1\nlevel=1\ta=0.5,0.5\tb=1\n"

# ── Phase diagram plots ───────────────────────────────────────────────────────
[phase_plots]
comps_folder   = "Comps"
output_folder  = "Phase_Diagrams"
t_start        = 200
t_end          = 2000
t_step         = 200
make_gif       = true
gif_t_step     = 10
fixed_elements = ["B"]
metal_fraction = 0.3333333333333333

# ── Phase grid video ──────────────────────────────────────────────────────────
[phase_grid]
t_start = 200
t_end   = 2000
t_step  = 10

# ── Oxidation database ────────────────────────────────────────────────────────
[database]
fixed_elements   = ["B"]
oxygen_element   = "O"
mlip             = "orb"
run_compositions = true
run_download     = true
run_energies     = true
run_database     = true
api_key_env      = "MP_API_KEY"   # name of env var holding your Materials Project key

# ── Oxidation calculations ────────────────────────────────────────────────────
[oxidation]
mode                        = "batch"   # "batch" or "single"
phase_element               = "B"
phase_element_stoichiometry = 2.0
mixed_phase_subdir          = "blade"
fixed_phases_subdir         = "ORB"

[oxidation_batch]
run_plots      = true   # all plot types
run_animated   = true   # GIFs and MP4s
skip_existing  = true   # skip if tables / analysis already exist
temperature_range      = [250, 2000, 250]
mu_o_range             = [-10.0, -4.0, 0.1]
scan_x                 = 0.5
scan_T                 = [700, 1270, 2000, 2500]
scan_mu_o_range        = [-10.0, -4.0, 0.05]
map_x_range            = [0.0, 1.0, 0.01]
slice_remainder_ratios = [0.0, 0.25, 0.3333333333333333, 0.5, 0.6666666666666666, 0.75, 1.0]
slice_muT_comp_step    = 0.1

