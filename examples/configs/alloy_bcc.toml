# alloy_bcc.toml — BCC refractory high-entropy alloys
# Single sublattice (a), no fixed elements, no oxidation.
# Examples: MoNbTaW, CrMoNbTaVW, HfMoNbTiZr
#
# Usage (merge on top of full_framework.toml):
#   uv run --extra workflow python examples/full_framework.py \
#       examples/full_framework.toml examples/configs/alloy_bcc.toml

# ── Stages — disable oxidation for pure alloy work ────────────────────────────
[stages]
sqs_generation   = true
tdb_fitting      = true
phase_diagrams   = true
oxide_database   = false
oxidation_graphs = false

# ── Elements ───────────────────────────────────────────────────────────────────
[elements]
primary       = ["Mo", "Nb", "Ta", "W", "Cr", "V", "Ti", "Hf", "Zr"]
secondary     = []
primary_min   = 2
primary_max   = 4
secondary_min = 0
secondary_max = 0

# ── TDB ────────────────────────────────────────────────────────────────────────
[tdb]
level        = 6
comps_folder = "Comps_BCC"

# BCC: single sublattice (a only)
tdb_sqs_levels = [
    { level = 0, compositions = [[1.0, 0.0]],                     letter = ["a"] },
    { level = 1, compositions = [[0.5, 0.5]],                     letter = ["a"] },
    { level = 2, compositions = [[0.75, 0.25]],                   letter = ["a"] },
    { level = 3, compositions = [[0.33333, 0.33333, 0.33333]],    letter = ["a"] },
    { level = 4, compositions = [[0.5, 0.25, 0.25]],              letter = ["a"] },
    { level = 5, compositions = [[0.875, 0.125], [0.625, 0.375]], letter = ["a"] },
    { level = 6, compositions = [[0.75, 0.125, 0.125]],           letter = ["a"] },
]

# ── Phase prototype ────────────────────────────────────────────────────────────
# BCC: Im-3m, a ≈ 3.15 Å (average for Mo/Nb/Ta/W group)
[phase]
key              = "BCC1"
generator_name   = "BCC"
a                = 3.15
b                = 3.15
c                = 3.15
alpha            = 90
beta             = 90
gamma            = 90
supercell_size   = [4, 4, 4]
use_average_lattice = true
vectors = """1 0 0
0 1 0
0 0 1
"""
coords = """0.000000 0.000000 0.000000 a
0.500000 0.500000 0.500000 a
"""

# ── Phase diagram plots ────────────────────────────────────────────────────────
[phase_plots]
fixed_elements = []
metal_fraction = 1.0
